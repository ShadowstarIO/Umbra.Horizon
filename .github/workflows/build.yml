name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  SOLUTION_NAME: Umbra.Horizon
  RELEASE_DIR: out/Release
  RELEASE_TAG: "0.0.1"

jobs:
  Build:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud Latest
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

      - name: Download Umbra Latest
        run: |
          Invoke-WebRequest -Uri https://raw.githubusercontent.com/una-xiv/umbra-dist/main/dist/Umbra/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\installedPlugins\Umbra\dist"

      - name: Build solution
        run: |
          dotnet restore -r win ${{ env.SOLUTION_NAME }}.sln
          dotnet build --configuration Release --no-restore

      - name: Create plugin archive
        run: |
          $src = "${{ env.RELEASE_DIR }}"
          if (-not (Test-Path $src)) { throw "Release output missing: $src" }
          $dll = Join-Path $src "${{ env.SOLUTION_NAME }}.dll"
          if (-not (Test-Path $dll)) { throw "Plugin DLL missing: $dll" }
          $zip = Join-Path $src "${{ env.SOLUTION_NAME }}.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path (Join-Path $src "*") -DestinationPath $zip -Force
          Write-Host "Created $zip"

      - name: Publish Plugin
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          body: Pre-release Horizon widget for Umbra.
          files: ${{ env.RELEASE_DIR }}/${{ env.SOLUTION_NAME }}.zip
          make_latest: true
          prerelease: false
          fail_on_unmatched_files: true
